name: Tests

# Every push, so a branch has a run before its PR opens (the PR shows the
# same checks on its head commit); manual reruns from the Actions tab.
# The daily audit lives in security-audit.yml: a schedule here would let
# GitHub's 60-day inactivity rule disable this whole workflow.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails on a high or critical advisory against anything the site ships.
  # Dev-only advisories are left out on purpose (tracked in TODOS.md). Its
  # own job, so an advisory or a registry outage never stops the tests.
  # npm audit reads package-lock.json, so no install is needed. The same
  # command runs daily in security-audit.yml; keep the two in step.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests (builds and serves production)
        run: npm run test:e2e
      - name: Keep Playwright traces from failed runs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
