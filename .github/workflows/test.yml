name: Tests

# Every push, so a branch has a run before its PR opens (the PR shows the
# same checks on its head commit); manual reruns from the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests (builds and serves production)
        run: npm run test:e2e
